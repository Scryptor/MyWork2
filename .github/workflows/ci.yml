name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Check without dev-dependencies
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  postgres:
    name: postgres (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MW_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace

  ui:
    name: ui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm ci
      - run: npm run verify

  # The server is built once; both browsers take the binary as an artifact.
  e2e-server:
    name: e2e-server (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p mw-server
      - uses: actions/upload-artifact@v5
        with:
          name: mw-server-linux
          path: target/debug/mw-server
          retention-days: 1
          if-no-files-found: error

  # The image carries the browsers and their system libraries (no apt); its tag must equal the @playwright/test version
  # in apps/ui/package-lock.json.
  ui-e2e:
    name: ui-e2e (${{ matrix.project }})
    needs: e2e-server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v5
      - run: node --version
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: mw-server-linux
          path: mw-server-bin
      - run: chmod +x "$GITHUB_WORKSPACE/mw-server-bin/mw-server"
      - run: npm run build
      - run: MW_E2E_SERVER_BIN="$GITHUB_WORKSPACE/mw-server-bin/mw-server" npx playwright test --project=${{ matrix.project }}
      # Screenshots of the screen sweep (layout-<case>-<scene>.png) and the traces of failed tests: a person looks
      # at them, they are not compared with a reference.
      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-e2e-results-${{ matrix.project }}
          path: apps/ui/test-results
          retention-days: 7
