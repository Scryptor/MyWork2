name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Check without dev-dependencies
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  postgres:
    name: postgres (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MW_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace

  ui:
    name: ui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm ci
      - run: npm run verify

  # The desktop program (Tauri 2) is a Cargo workspace of its own, so the main one builds without WebKitGTK on
  # Linux. Format, lints, tests and the licences of the program — the installers come with plan 11. tauri-build
  # copies the built interface (apps/ui/build) as a resource of the program, so the interface is built first.
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v5
      - name: Install WebKitGTK and the other Tauri libraries (up to three attempts of 5 minutes)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 16
        run: >-
          for i in 1 2 3; do
          timeout 300 sudo apt-get update &&
          timeout 300 sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
          && exit 0; echo "retry $i"; done; exit 1
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - name: Install the interface's packages
        working-directory: apps/ui
        run: npm ci
      - name: Build the interface
        working-directory: apps/ui
        run: npm run build
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # What goes into the program (normal dependencies, every desktop target at once): no MPL or copyleft.
      - name: Licences of the program
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npm run licenses

  # The server is built once; both browsers take the binary as an artifact. With it goes make_fixture, which
  # writes the synthetic MyWork 2 folder of the import tests (the artifact keeps the paths below target/debug).
  e2e-server:
    name: e2e-server (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p mw-server
      - run: cargo build -p mw-legacy --features fixtures --example make_fixture
      - uses: actions/upload-artifact@v5
        with:
          name: mw-server-linux
          path: |
            target/debug/mw-server
            target/debug/examples/make_fixture
          retention-days: 1
          if-no-files-found: error

  # The image carries the browsers and their system libraries (no apt); its tag must equal the @playwright/test version
  # in apps/ui/package-lock.json (`npm run verify` runs scripts/check-playwright-image.mjs, which fails on a mismatch).
  ui-e2e:
    name: ui-e2e (${{ matrix.project }})
    needs: e2e-server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v5
      - run: node --version
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: mw-server-linux
          path: mw-server-bin
      - run: chmod +x "$GITHUB_WORKSPACE/mw-server-bin/mw-server" "$GITHUB_WORKSPACE/mw-server-bin/examples/make_fixture"
      - run: npm run build
      # $GITHUB_WORKSPACE, not github.workspace: inside the container only the variable has the container's path.
      - run: >-
          MW_E2E_SERVER_BIN="$GITHUB_WORKSPACE/mw-server-bin/mw-server"
          MW_E2E_FIXTURE_BIN="$GITHUB_WORKSPACE/mw-server-bin/examples/make_fixture"
          npx playwright test --project=${{ matrix.project }}
      # Screenshots of the screen sweep (layout-<case>-<scene>.png) and the traces of failed tests: a person looks
      # at them, they are not compared with a reference.
      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-e2e-results-${{ matrix.project }}
          path: apps/ui/test-results
          retention-days: 7
