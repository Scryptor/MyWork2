name: Сборка установщиков

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            extension: deb
          - platform: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            bundle: dmg
            extension: dmg
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
    steps:
      - uses: actions/checkout@v5
      - name: Установить системные библиотеки Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Установить Rust
        shell: bash
        run: rustup toolchain install
      - name: Установить цели Rust для универсальной сборки macOS
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/ui/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/ui
      - run: npm ci
        working-directory: apps/desktop
      - name: Собрать установщик
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - uses: actions/upload-artifact@v5
        with:
          name: mywork-${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }}
          if-no-files-found: error
