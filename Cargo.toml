[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
sea-orm = { version = "2.0", default-features = false, features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio",
    "macros",
    "with-chrono",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio",
] }
tokio = "1"
sqlx = { version = "0.9", default-features = false, features = ["tls-rustls-ring-native-roots"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
argon2 = "0.6"
sha1 = "0.11"
sha2 = "0.11"
hex = "0.4"
getrandom = "0.4"
tracing = "0.1"
utoipa = { version = "6", default-features = false, features = ["macros", "chrono"] }
ts-rs = { version = "12", features = ["chrono-impl", "serde-json-impl", "no-serde-warnings"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", default-features = false, features = ["query"] }
utoipa-axum = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
rpassword = "7"
iana-time-zone = "0.1"
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Argon2 в отладочной сборке ~10× медленнее и тормозит каждый тест со входом.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
