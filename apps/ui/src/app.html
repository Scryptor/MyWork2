<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(function () {
				try {
					var raw = null;
					try {
						raw = localStorage.getItem('mw.prefs');
					} catch (e) {}
					var o = {};
					try {
						var parsed = raw === null ? null : JSON.parse(raw);
						if (parsed && typeof parsed === 'object') o = parsed;
					} catch (e) {}
					var theme = ['system', 'light', 'dark'].indexOf(o.theme) >= 0 ? o.theme : 'system';
					var scale = [0.9375, 1, 1.125, 1.25].indexOf(o.scale) >= 0 ? o.scale : 1;
					var density = o.density === 'compact' ? 'compact' : 'comfortable';
					var dark = false;
					try {
						dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					} catch (e) {}
					var root = document.documentElement;
					root.setAttribute('data-theme', theme === 'system' ? (dark ? 'dark' : 'light') : theme);
					root.setAttribute('data-density', density);
					root.style.setProperty('--ui-scale', String(scale));
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
