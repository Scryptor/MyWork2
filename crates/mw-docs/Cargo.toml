[package]
name = "mw-docs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
testing = []

[dependencies]
thiserror = { workspace = true }
typst = { workspace = true }
typst-pdf = { workspace = true }
typst-render = { workspace = true }
typst-layout = { workspace = true }
comemo = { workspace = true }
mw-domain = { path = "../mw-domain" }
serde = { workspace = true }
serde_json = { workspace = true }
# `memmap`: the book of fonts is built from the mapped file (`with_face_data`), not from a second read.
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap"] }
qrcode = { version = "0.15", default-features = false, features = ["std"] }
tracing = { workspace = true }

[dev-dependencies]
mw-docs = { path = ".", features = ["testing"] }
tempfile = { workspace = true }
image = { workspace = true }
typst-assets = { version = "0.15.1", features = ["fonts"] }
rqrr = { version = "0.11", default-features = false }
