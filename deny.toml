# Licences of the Rust dependencies of the main workspace (AGENTS.md: MIT / Apache-2.0 / BSD / ISC / Zlib / Unicode;
# no MPL and no copyleft). Fonts are not crates: their OFL-1.1 text lives next to them (crates/mw-docs/fonts).
# The desktop program is a workspace of its own and is checked by `npm run licenses` in apps/desktop.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Only as the alternative of an OR expression (roman-numerals-rs: "0BSD OR CC0-1.0").
    "0BSD",
]
confidence-threshold = 0.9
# Our own crates carry `license = "MIT"`, but must not fail the check even if a field is missing.
private = { ignore = true }
